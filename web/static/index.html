<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lincoco 实时语音对话</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap">
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #e0e0e0;
      --bubble-user: #2c3e50;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #dcdcdc;
      --bubble-assistant-text: #333333;
      --bg: #f4f4f4;
      --shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }
    .chat-container {
      flex: 1;
      max-width: 480px;
      width: 100%;
      background: #fff;
      box-shadow: var(--shadow);
      margin: 24px 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: var(--primary);
      color: #fff;
      padding: 18px 24px;
      font-size: 1.25rem;
      letter-spacing: 1px;
      font-weight: 500;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      font-size: 0.9rem;
      color: #c0c0c0;
      margin-left: auto;
    }
    .messages {
      flex: 1;
      padding: 20px 16px 16px 16px;
      overflow-y: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 82%;
      font-size: 1.02rem;
      line-height: 1.6;
      position: relative;
      display: inline-block;
      word-break: break-word;
      box-shadow: 0 0.5px 2px rgba(44,62,80,0.1);
    }
    .bubble.user {
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      margin-left: auto;
    }
    .bubble.assistant {
      background: var(--bubble-assistant);
      color: var(--bubble-assistant-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      margin-right: auto;
    }
    .bubble.typing {
      background: #ebedef;
      color: #444;
      font-style: italic;
      opacity: 0.9;
      animation: pulsebg 1.3s linear infinite;
      min-width: 60px;
      border-radius: 16px;
    }
    @keyframes pulsebg {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
    .input-bar {
      display: flex;
      padding: 12px 12px;
      background: #fff;
      border-top: 1px solid #e1e5ef;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .input-bar button {
      appearance: none;
      outline: none;
      border: none;
      padding: 8px 18px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
      margin-left: 4px;
    }
    .input-bar button:active {
      background: #203a4a;
    }
    .input-bar button:disabled {
      background: #a0a0a0;
      cursor: default;
    }
    @media (max-width: 600px) {
      .chat-container {
        margin: 0;
        border-radius: 0;
        max-width: 100vw;
      }
      .header {
        border-radius: 0;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-weight: 500;
      font-size: 16px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
    }
    .btn svg {
      margin: 0;
    }
    .start-btn {
      background-color: #2a3543;
    }
    .stop-btn {
      background-color: #c04949;
    }
    .reset-btn {
      background-color: #0d65d0;
    }
    .copy-btn {
      background-color: #28a745;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .text-input-container {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: flex-end;
    }
    .text-input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #textInput {
      width: 100%;
      min-height: 40px;
      max-height: 120px;
      padding: 10px 12px;
      border: 1px solid #e1e5ef;
      border-radius: 8px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      box-sizing: border-box;
    }
    #textInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(44, 62, 80, 0.1);
    }
    #textInput::placeholder {
      color: #999;
    }
    .send-text-btn {
      padding: 10px 20px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      height: 40px;
    }
    .send-text-btn:hover {
      background-color: #203a4a;
    }
    .send-text-btn:active {
      transform: scale(0.98);
    }
    .send-text-btn:disabled {
      background-color: #a0a0a0;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="chat-container">
      <div class="header">
        <svg height="24" width="24" viewBox="0 0 22 22" fill="#fff" style="margin-right:8px">
          <circle cx="11" cy="11" r="12" fill="#222F3D" />
          <text
            x="50%"
            y="50%"
            fill="#fff"
            text-anchor="middle"
            alignment-baseline="middle"
            font-size="12"
            font-family="Inter"
          >AI</text>
        </svg>
        Lincoco 实时语音对话
        <span class="status" id="status">未连接</span>
      </div>
      <div id="permissionHint" style="padding: 12px 16px; background: #fff3cd; color: #856404; font-size: 0.9rem; border-bottom: 1px solid #e1e5ef; display: none;">
        <strong>提示：</strong>首次使用需要授权麦克风权限。如果被拒绝，请点击地址栏的锁图标允许麦克风访问，然后刷新页面。
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <div class="text-input-container">
          <div class="text-input-wrapper">
            <textarea 
              id="textInput" 
              placeholder="输入文字消息（回车发送，Shift+Enter 换行）..."
              rows="1"
            ></textarea>
          </div>
          <button id="sendTextBtn" title="发送文字消息" class="send-text-btn">发送</button>
        </div>
        <button id="startBtn" title="开始语音对话" class="btn start-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 5L18 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        
        <button id="stopBtn" title="停止语音对话" class="btn stop-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        
        <button id="clearBtn" title="清空对话历史" class="btn reset-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C14.8273 3 17.35 4.30367 19 6.34267" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14.5 6.5L19.5 6.5L19.5 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button id="copyBtn" title="复制对话内容" class="btn copy-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
           <rect x="9" y="9" width="11" height="11" rx="1" stroke="currentColor" stroke-width="2"/>
           <path d="M5 15H4C3.44772 15 3 14.5523 3 14V4C3 3.44772 3.44772 3 4 3H14C14.5523 3 15 3.44772 15 4V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
         </svg>
       </button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
